<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微蕉阁 (WeiJiaoGe) — Gemini Flash Image Preview 资源收集</title>
    <meta name="description" content="持续收集与展示 Gemini Flash Image Preview（Nano Banana）的资源与使用案例。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="public/style.css">
</head>
<body>

<div class="page-progress" id="progress-bar"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="关闭">&#x2715;</button>
    <img id="lightbox-img" src="" alt="放大查看">
    <p class="lightbox-caption" id="lightbox-caption"></p>
</div>

<!-- Nav -->
<nav class="site-nav">
    <a href="index.html" class="nav-logo">微蕉阁 <span>·</span> WeiJiaoGe</a>
    <ul class="nav-links">
        <li><a href="index.html" class="active">资源列表</a></li>
        <li><a href="cases.html">使用案例</a></li>
    </ul>
</nav>

<!-- Hero -->
<section class="hero">
    <div>
        <h1 class="hero-title">The Archive of<br><em>Nano Banana</em></h1>
        <p class="hero-subtitle">Gemini Flash Image Preview · 资源聚合与案例展示</p>
    </div>
    <div class="hero-stats">
        <div class="hero-stat-num" id="hero-count">—</div>
        <div class="hero-stat-label">件资源</div>
    </div>
</section>

<!-- Filters -->
<div class="filters">
    <div class="filter-group">
        <label for="q">搜索资源</label>
        <div class="search-wrapper">
            <input type="text" id="q" placeholder="标题、描述或作者…">
        </div>
    </div>
    <div class="filter-group">
        <label for="type">类型</label>
        <select id="type">
            <option value="">全部类型</option>
        </select>
    </div>
    <div class="filter-group">
        <label for="source">来源</label>
        <select id="source">
            <option value="">全部来源</option>
        </select>
    </div>
    <div class="filter-group">
        <label for="sort">排序</label>
        <select id="sort">
            <option value="score">综合排序</option>
            <option value="recent">最新更新</option>
            <option value="stars">星标数</option>
        </select>
    </div>
</div>

<!-- Stats -->
<div class="stats-bar" id="stats">加载中…</div>

<!-- List -->
<ul class="gallery-list" id="list">
    <li class="loading">正在载入资源数据…</li>
</ul>

<!-- Footer -->
<footer class="site-footer">
    <span>微蕉阁 · WeiJiaoGe</span>
    <span>数据每日自动更新</span>
</footer>

<script src="app.js"></script>
<script>
// Progress bar on scroll
(function() {
    const bar = document.getElementById('progress-bar');
    window.addEventListener('scroll', function() {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.width = (docHeight > 0 ? (scrollTop / docHeight * 100) : 0) + '%';
    }, { passive: true });

    // Update hero count after data loads
    const observer = new MutationObserver(function() {
        const stats = document.getElementById('stats');
        const text = stats.textContent;
        const match = text.match(/共\s*([\d,]+)\s*条/);
        if (match) {
            document.getElementById('hero-count').textContent = parseInt(match[1]).toLocaleString();
        }
    });
    observer.observe(document.getElementById('stats'), { childList: true, characterData: true, subtree: true });

    // Lightbox (for any future image in cards)
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    const lbCaption = document.getElementById('lightbox-caption');
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lb.addEventListener('click', function(e) { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });
    function closeLightbox() { lb.classList.remove('open'); lbImg.src = ''; }
    window.openLightbox = function(src, caption) {
        lbImg.src = src; lbCaption.textContent = caption || ''; lb.classList.add('open');
    };
})();
</script>
</body>
</html>
