name: Fetch and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # 每天凌晨2点
  push:
    paths:
      - "scripts/**"
      - "fetchers/**"
      - ".github/workflows/fetch.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: fetcher-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fetcher-cache-${{ runner.os }}-

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_TLS_REJECT_UNAUTHORIZED: 0
        run: |
          echo "🚀 开始运行智能提取算法..."
          echo "📊 环境变量检查:"
          echo "  GITHUB_TOKEN: ${GITHUB_TOKEN:+已设置}"
          echo "  SERPAPI_KEY: ${SERPAPI_KEY:+已设置}"
          echo "  SERPER_API_KEY: ${SERPER_API_KEY:+已设置}"
          echo "  GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:+已设置}"
          echo "  GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:+已设置}"
          echo "  GEMINI_API_KEY: ${GEMINI_API_KEY:+已设置}"
          echo "  OPENAI_API_KEY: ${OPENAI_API_KEY:+已设置}"
          echo ""
          node scripts/update.mjs

      - name: Commit data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): update aggregated sources and cases"
          file_pattern: "public/data.json public/cases.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site artifact
        run: |
          mkdir -p _site
          cp -r public _site/
          cp index.html cases.html app.js cases.js _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
