<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Nano Banana 使用案例 — 微蕉阁</title>
    <meta name="description" content="Gemini Nano Banana 的具体 Prompt、效果与生成图片展示。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="public/style.css">
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('weijiaoge-theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = saved || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
</head>
<body>

<div class="page-progress" id="progress-bar"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="关闭">&#x2715;</button>
    <img id="lightbox-img" src="" alt="放大查看">
    <p class="lightbox-caption" id="lightbox-caption"></p>
</div>

<!-- Nav -->
<nav class="site-nav">
    <a href="index.html" class="nav-logo">微蕉阁 <span>·</span> WeiJiaoGe</a>
    <ul class="nav-links">
        <li><a href="index.html">资源列表</a></li>
        <li><a href="cases.html" class="active">使用案例</a></li>
    </ul>
    <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="切换深色/浅色模式" title="切换深色/浅色模式">
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>
</nav>

<!-- Hero -->
<section class="hero">
    <div>
        <h1 class="hero-title"><em>Cases</em> Gallery</h1>
        <p class="hero-subtitle">Gemini Nano Banana · Prompt · 效果 · 生成图像</p>
    </div>
    <div class="hero-stats">
        <div class="hero-stat-num" id="hero-count">—</div>
        <div class="hero-stat-label">件案例</div>
    </div>
</section>

<!-- Filters -->
<div class="filters">
    <div class="filter-group search-group">
        <label for="search">搜索案例</label>
        <div class="search-wrapper">
            <input type="text" id="search" placeholder="输入标题、Prompt 或效果关键词…">
        </div>
    </div>
    <div class="filter-group sort-group">
        <label for="sort">排序</label>
        <select id="sort">
            <option value="category">按分类</option>
            <option value="title">按标题</option>
            <option value="path">按来源</option>
        </select>
    </div>
    <select id="category" style="display: none;"><option value="">全部分类</option></select>
    <select id="path" style="display: none;"><option value="">全部来源</option></select>
</div>

<!-- Horizontal Taxonomy Bar (Primary Categories & Feature Chips) -->
<div class="taxonomy-bar" id="taxonomy-bar">
    <div class="category-chips-row" id="category-chips"></div>
    <div class="feature-chips-row" id="feature-chips"></div>
</div>

<!-- Stats -->
<div class="stats-bar" id="stats">加载中…</div>

<!-- Cases Grid -->
<div class="cases-grid" id="cases-grid">
    <div class="loading">正在载入案例数据…</div>
</div>

<!-- Batch Sentinel for Incremental Masonry Loading -->
<div class="batch-sentinel" id="batch-sentinel">
    <span class="sentinel-text">向下滚动加载更多…</span>
</div>

<!-- Workbench Modal (Ticket 5 & ADR 0004) -->
<div id="workbench-modal" class="workbench-modal" role="dialog" aria-modal="true" aria-hidden="true" style="display: none;">
    <div class="workbench-backdrop" id="workbench-backdrop"></div>
    <div class="workbench-dialog">
        <button class="workbench-close-btn" id="workbench-close-btn" aria-label="关闭工作台 (Esc)" title="关闭 (Esc)">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <div class="workbench-nav-bar">
            <button class="workbench-nav-btn prev-case-btn" id="workbench-prev-btn" aria-label="上一个案例 (←)" title="上一个案例 (←)">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>上一个</span>
            </button>
            <span class="workbench-case-counter" id="workbench-case-counter">1 / 1</span>
            <button class="workbench-nav-btn next-case-btn" id="workbench-next-btn" aria-label="下一个案例 (→)" title="下一个案例 (→)">
                <span>下一个</span>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
        <div class="workbench-content">
            <!-- Left Pane: Media Viewport & Thumbnail Strip -->
            <div class="workbench-media-pane">
                <div class="workbench-media-viewport">
                    <img id="workbench-main-img" class="workbench-main-img" src="" alt="案例效果图" />
                </div>
                <div class="workbench-thumbnail-strip" id="workbench-thumb-strip"></div>
            </div>
            <!-- Right Pane: Structured Prompt Breakdown, Variables, Studio Handoff -->
            <div class="workbench-info-pane">
                <div class="workbench-header">
                    <h2 class="workbench-title" id="workbench-title"></h2>
                    <div class="workbench-meta">
                        <span class="workbench-category" id="workbench-category"></span>
                        <div class="workbench-tags" id="workbench-tags"></div>
                    </div>
                </div>
                <div class="workbench-prompt-section">
                    <div class="workbench-prompt-header">
                        <span class="workbench-section-label">Prompt 结构化解析</span>
                        <div class="workbench-chain-tabs" id="workbench-chain-tabs"></div>
                    </div>
                    <div class="workbench-prompt-box" id="workbench-prompt-box">
                        <div class="workbench-prompt-content" id="workbench-prompt-content"></div>
                    </div>
                </div>
                <div class="workbench-effects-section" id="workbench-effects-section">
                    <span class="workbench-section-label">效果与说明</span>
                    <div class="workbench-effects-content" id="workbench-effects-content"></div>
                </div>
                <div class="workbench-actions">
                    <button class="workbench-action-btn workbench-copy-btn" id="workbench-copy-btn" title="复制当前步骤 Prompt">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span id="workbench-copy-label">复制 Prompt</span>
                    </button>
                    <a class="workbench-action-btn studio-handoff-btn" id="workbench-studio-btn" href="https://aistudio.google.com/prompts/new_chat" target="_blank" rel="noopener noreferrer" title="在 Google AI Studio 中尝试此提示词">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span>在 Google AI Studio 中运行</span>
                    </a>
                </div>
                <div class="workbench-source">
                    <a id="workbench-source-link" href="#" target="_blank" rel="noopener noreferrer">查看原始案例来源 ↗</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="site-footer">
    <span>微蕉阁 · WeiJiaoGe</span>
    <span>数据每日自动更新</span>
</footer>

<!-- Toast Container -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<script>
/* ── Gallery enhancements injected before cases.js ── */
(function() {
    // Progress bar
    const bar = document.getElementById('progress-bar');
    window.addEventListener('scroll', function() {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.width = (docHeight > 0 ? (scrollTop / docHeight * 100) : 0) + '%';
    }, { passive: true });

    // Workbench Modal Bridge for backward compatibility
    window.openLightbox = function(src, caption) {
        if (typeof window.openWorkbench === 'function') {
            window.openWorkbench(src);
        }
    };

    // Lazy-load images + fade-in after cases.js renders
    function enhanceImages() {
        document.querySelectorAll('.case-image-wrap img:not([data-enhanced])').forEach(function(img) {
            img.setAttribute('data-enhanced', '1');
            if (img.complete) { img.classList.add('loaded'); } else {
                img.addEventListener('load',  function() { img.classList.add('loaded'); });
                img.addEventListener('error', function() { img.style.display = 'none'; });
            }
        });
    }

    // Update hero count
    function updateHeroCount() {
        const stats = document.getElementById('stats');
        const match = stats.textContent.match(/共\s*([\d,]+)\s*个/);
        if (match) document.getElementById('hero-count').textContent = parseInt(match[1]).toLocaleString();
    }

    // Observe cases-grid for mutations (cases.js re-renders on filter)
    const grid = document.getElementById('cases-grid');
    const obs = new MutationObserver(function() {
        enhanceImages();
        updateHeroCount();
    });
    obs.observe(grid, { childList: true, subtree: true });

    const statsEl = document.getElementById('stats');
    const statsObs = new MutationObserver(updateHeroCount);
    statsObs.observe(statsEl, { childList: true, characterData: true, subtree: true });

    // Theme toggle interaction
    const themeBtn = document.getElementById('theme-toggle');
    if (themeBtn) {
        themeBtn.addEventListener('click', function() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try {
                localStorage.setItem('weijiaoge-theme', next);
            } catch (e) {}
        });
    }
})();
</script>
<script src="cases.js"></script>
</body>
</html>
